<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="ai-agent-bell terminal preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1219"/>
      <stop offset="0.55" stop-color="#0d1922"/>
      <stop offset="1" stop-color="#10241f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#2bc9ae" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2bc9ae" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- terminal window -->
  <rect x="120" y="96" width="1040" height="528" rx="20" fill="#0e1822" stroke="#233442" stroke-width="2"/>
  <path d="M120 116a20 20 0 0 1 20-20h1000a20 20 0 0 1 20 20v44H120z" fill="#0b141d"/>
  <circle cx="158" cy="128" r="7" fill="#ff5f57"/>
  <circle cx="184" cy="128" r="7" fill="#febc2e"/>
  <circle cx="210" cy="128" r="7" fill="#28c840"/>
  <text x="640" y="135" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#7d8b99">ai-agent-bell</text>

  <!-- shell prompt -->
  <text x="170" y="224" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#7ee0b4">$</text>
  <text x="198" y="224" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="24" fill="#d7e3ec">npm i -g ai-agent-bell</text>
  <rect x="514" y="203" width="11" height="25" fill="#7ee0b4" opacity="0.75"/>
  <text x="170" y="266" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="18" fill="#6d7d8b">added 1 package in 3s</text>

  <!-- notification card -->
  <rect x="170" y="318" width="940" height="222" rx="18" fill="#132230" stroke="#2b4352" stroke-width="2"/>
  <rect x="170" y="318" width="8" height="222" rx="4" fill="#2bc9ae"/>
  <circle cx="272" cy="429" r="46" fill="#12352c" stroke="#2bc9ae" stroke-width="2"/>
  <g transform="translate(272 429) scale(1.85) translate(-12 -12)" fill="#7ee0b4">
    <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5S10.5 3.17 10.5 4v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
  </g>
  <text x="342" y="408" font-family="'Segoe UI', Arial, sans-serif" font-size="40" font-weight="700" fill="#eef7f3">Your agent needs input</text>
  <text x="342" y="450" font-family="'Segoe UI', Arial, sans-serif" font-size="23" fill="#93a6b2">opencode · main · waiting 0:42</text>
  <rect x="918" y="390" width="156" height="44" rx="22" fill="#3a2a12" stroke="#7a5a1f"/>
  <circle cx="946" cy="412" r="7" fill="#ffca6a"/>
  <text x="966" y="419" font-family="'Segoe UI', Arial, sans-serif" font-size="19" font-weight="700" fill="#ffca6a">RINGING</text>

  <!-- compatibility chips -->
  <text x="170" y="600" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#5c6d7a">works with</text>
  <g font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#9fb0bc">
    <rect x="300" y="572" width="132" height="40" rx="20" fill="#16222d" stroke="#2b4352"/>
    <text x="366" y="598" text-anchor="middle">opencode</text>
    <rect x="448" y="572" width="158" height="40" rx="20" fill="#16222d" stroke="#2b4352"/>
    <text x="527" y="598" text-anchor="middle">claude code</text>
    <rect x="622" y="572" width="110" height="40" rx="20" fill="#16222d" stroke="#2b4352"/>
    <text x="677" y="598" text-anchor="middle">codex</text>
  </g>
  <text x="1060" y="598" text-anchor="end" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#4e5f6c">v1.0.8</text>
</svg>
