<!DOCTYPE html>
<html lang="en" data-beasties-container="">
  <head>
    <meta charset="utf-8">
    <base href="/">
    <!--
      initial-scale=1 is not optional. Without it a phone lays the page out at
      the ~980px desktop width and then zooms out, so every media query below
      matches the wrong breakpoint and Google's mobile-friendly test fails the
      site outright.
    -->
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero on
    phones with a notch or gesture strip — without it the sidebar's footer
    padding for that strip computes to 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#008073">

    <!-- ================= Primary meta =================
      One <title> only. There used to be two, and a crawler keeps whichever it
      likes — which is how the tab and the search result came to disagree.
      Per-route title/description/canonical are then rewritten at runtime by
      SeoService; the values here are the home page's, and the fallback for any
      client that never runs the script.
    -->
    <title>Hemant Rao | Front-End Developer</title>
    <meta name="description" content="Front-end developer in Gurgaon building fast, accessible interfaces in Vue, Angular and TypeScript — enterprise dashboards that stay quick under large, high-frequency datasets.">
    <meta name="author" content="Hemant Rao">
    <link rel="canonical" href="https://hemantrao.in/">

    <!-- ================= Open Graph / Facebook ================= -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:site_name" content="Hemant Rao">
    <meta property="og:url" content="https://hemantrao.in/">
    <meta property="og:title" content="Hemant Rao | Front-End Developer">
    <meta property="og:description" content="Front-end developer in Gurgaon building fast, accessible interfaces in Vue, Angular and TypeScript — enterprise dashboards that stay quick under large, high-frequency datasets.">
    <meta property="og:image" content="https://hemantrao.in/assets/hemant-rao.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="400">
    <meta property="og:image:height" content="300">
    <meta property="og:image:alt" content="Hemant Rao, front-end developer">

    <!-- ================= Twitter =================
      name=, not property=. Twitter's parser reads the name attribute; the
      property spelling is Open Graph's and was being ignored, which is why the
      card fell back to whatever OG happened to say.
      summary (not summary_large_image) matches the 400x300 portrait actually
      linked above — a large-image card crops a portrait badly.
    -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Hemant Rao | Front-End Developer">
    <meta name="twitter:description" content="Front-end developer in Gurgaon building fast, accessible interfaces in Vue, Angular and TypeScript.">
    <meta name="twitter:image" content="https://hemantrao.in/assets/hemant-rao.png">
    <meta name="twitter:image:alt" content="Hemant Rao, front-end developer">

    <link rel="shortcut icon" href="assets/dev.png">
    <link rel="icon" type="image/png" href="assets/dev.png">

    <!--
      Both font hosts are cross-origin and are discovered late (the @import for
      Inter sits inside the stylesheet). Opening the connections here overlaps
      the DNS/TLS handshake with the rest of the head instead of paying for it
      after the CSS has already parsed.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin="">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!--
      Structured data, so a search for the name returns a person rather than a
      page. This is deliberately static rather than injected by Angular: Google
      does render JavaScript, but it does so on a second pass that can lag the
      first by days, and a knowledge-panel entity is exactly the thing worth
      having in the first pass. It describes the site as a whole, so it is the
      same on every route and does not need to change with navigation.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Hemant Rao",
        "url": "https://hemantrao.in/",
        "image": "https://hemantrao.in/assets/hemant-rao.png",
        "jobTitle": "Front-End Developer",
        "description": "Front-end developer building fast, accessible interfaces in Vue, Angular and TypeScript, with a focus on data-heavy enterprise dashboards.",
        "email": "mailto:hello@hemantrao.in",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Gurgaon",
          "addressRegion": "Haryana",
          "addressCountry": "IN"
        },
        "knowsAbout": [
          "Vue.js",
          "Angular",
          "TypeScript",
          "JavaScript",
          "HTML",
          "CSS",
          "Web accessibility",
          "Front-end performance"
        ],
        "sameAs": [
          "https://in.linkedin.com/in/hemant--rao",
          "https://github.com/hemant-rao"
        ]
      }
    </script>

    <!--
      The built stylesheet is loaded non-render-blocking (media="print", then
      swapped to "all" on load), so for the first frame after a hard reload
      nothing has yet told the browser that a *closed* Bootstrap modal is
      hidden — and the profile photo inside it painted full-screen before
      vanishing. This has to live inline in the document head to apply on that
      first frame; a rule in styles.css arrives with the very stylesheet that
      is late. Opening the modal still works: Bootstrap sets an inline
      display:block, which outranks this.
    -->
    <style>
      .modal {
        display: none;
      }
    </style>

    <!--
      Theme has to be resolved before the first paint, not in ngOnInit. Angular
      boots after the document has already painted once, so setting the
      attribute there means a dark-theme visitor gets a full white frame first —
      the flash every themed site is judged by.

      Deliberately inline and synchronous in <head>: an external file, defer, or
      async would all land after that first paint and defeat the point. The
      stored value is validated rather than trusted, so a hand-edited
      localStorage entry cannot inject an arbitrary attribute value.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "dark" || stored === "light"
              ? stored
              : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* Private mode can throw on localStorage access. Light is the
             documented default, and the attribute simply stays unset. */
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
